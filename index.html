<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VOLTA FACIL</title>
<style>
body{margin:0;background:#000;color:#0f0;font-family:Arial;text-align:center;overflow:hidden}
h1{color:#00ff88;margin-top:20px;font-size:36px}
#score{font-size:22px;margin:10px}
#game{width:90%;max-width:380px;height:60vh;background:#111;border:3px solid #00ff88;margin:0 auto;border-radius:15px;position:relative;overflow:hidden}
#player{width:45px;height:45px;background:#00ff88;border-radius:12px;position:absolute;bottom:15px;left:45%;}
.enemy{width:40px;height:40px;background:#ff2040;position:absolute;top:-50px;border-radius:10px}
button{background:#00ff88;color:#000;border:0;padding:16px 60px;border-radius:30px;font-size:22px;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<h1>VOLTA FACIL</h1>
<div id="score">Pontos: 0</div>
<div id="game"><div id="player"></div></div>
<button onclick="iniciar()">JOGAR</button>
<script>
let pts=0,ativo=false,px=45,obs=[];
let game=document.getElementById('game'),player=document.getElementById('player'),score=document.getElementById('score');
function iniciar(){
 pts=0; obs=[]; ativo=true;
 document.querySelectorAll('.enemy').forEach(e=>e.remove());
 criar(); rodar();
}
function criar(){
 if(!ativo) return;
 let d=document.createElement('div'); d.className='enemy';
 d.style.left=Math.random()*85+'%'; game.appendChild(d);
 obs.push({el:d,y:-50,x:parseFloat(d.style.left)});
 setTimeout(criar,700);
}
function rodar(){
 if(!ativo) return;
 pts++; score.innerText='Pontos: '+pts;
 obs.forEach((o,i)=>{
   o.y+=6; o.el.style.top=o.y+'px';
   if(o.y>500){o.el.remove(); obs.splice(i,1)}
   if(o.y>300 && o.y<460 && Math.abs(o.x-px)<12){ativo=false; alert('BATEU! Fez '+pts+' pontos!');}
 });
 requestAnimationFrame(rodar);
}
game.addEventListener('touchmove',e=>{
 px=(e.touches[0].clientX-game.getBoundingClientRect().left)/game.clientWidth*100;
 player.style.left=px+'%';
},{passive:false});
</script>
</body>
</html>
