<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Volta Facil - Oliver Final 10m Voz</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;font-family:sans-serif;background:#fff}
#map{height:100vh;width:100vw}
#topbar{position:absolute;top:0;left:0;right:0;z-index:1000;background:#fff;padding:8px;display:flex;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.btn{flex:1;padding:14px;border:none;border-radius:14px;font-weight:900;font-size:14px;cursor:pointer}
#btnStart{background:#22c55e;color:#fff}
#btnStop{background:#ef4444;color:#fff;display:none}
#btnBack{background:#3b82f6;color:#fff;display:none}
#btnVoz{background:#8b5cf6;color:#fff;flex:0 0 50px}
#status{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);z-index:1000;background:#000;color:#fff;padding:12px 20px;border-radius:20px;display:none;font-weight:700;text-align:center;max-width:90%}
#info{position:absolute;bottom:10px;left:10px;right:10px;z-index:1000;background:#fff;padding:12px;border-radius:14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:13px}
.avatar-wrap{width:80px;height:95px;position:relative}
.avatar-wrap img{width:80px;height:95px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.walk{animation:walk.35s ease-in-out}
@keyframes walk{0%{transform:translateY(0)}25%{transform:translateY(-8px)}50%{transform:translateY(0)}75%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.dust{position:absolute;bottom:4px;left:50%;width:32px;height:12px;background:radial-gradient(ellipse, rgba(160,150,130,.85) 0%, rgba(200,195,180,.55) 45%, transparent 70%);border-radius:50%;transform:translateX(-50%);opacity:0;pointer-events:none}
.dust.show{animation:dustAnim.6s ease-out}
@keyframes dustAnim{0%{opacity:0;transform:translateX(-50%) scale(.3)}20%{opacity:.9;transform:translateX(-50%) scale(1.3)}100%{opacity:0;transform:translateX(-85%) scale(2) translateY(5px)}}
#lock{position:absolute;inset:0;z-index:9999;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:20px}
#lockBox{background:#fff;width:100%;max-width:360px;border-radius:24px;padding:24px;text-align:center}
#pass{width:100%;padding:16px;border:2px solid #e2e8f0;border-radius:14px;font-size:18px;text-align:center;font-weight:700;outline:none}
#btnOk{width:100%;margin-top:12px;padding:16px;background:#16a34a;color:#fff;border:none;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer}
#alertaRota{position:absolute;top:70px;left:10px;right:10px;z-index:2000;background:#ef4444;color:#fff;padding:18px;border-radius:18px;text-align:center;font-weight:900;font-size:18px;display:none;animation:piscar.5s infinite}
@keyframes piscar{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
#vozModal{position:absolute;inset:0;z-index:3000;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px}
#vozBox{background:#fff;width:100%;max-width:400px;border-radius:20px;padding:20px}
.falaItem{display:flex;gap:8px;align-items:center;background:#f1f5f9;padding:10px;border-radius:12px;margin:8px 0;font-size:13px}
.falaItem button{padding:10px 14px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.btnRec{background:#ef4444;color:#fff}.btnPlay{background:#22c55e;color:#fff}.btnDel{background:#e2e8f0;color:#000}
</style>
</head>
<body>
<div id="lock"><div id="lockBox"><h1>🔒 Volta Fácil</h1><p style="margin:8px 0;color:#64748b">Senha do Oliver</p><input id="pass" type="password" placeholder="digite oliver123"/><button id="btnOk" onclick="check()">ENTRAR</button><div id="err" style="color:#ef4444;margin-top:10px;display:none;font-weight:700">Senha errada!</div></div></div>

<div id="vozModal"><div id="vozBox">
<h2>🎙️ Sua voz - 3 falas</h2><p style="font-size:13px;color:#64748b;margin:8px 0">Grave "Você saiu da rota!" com sua voz. Vai tocar aleatório quando sair 10m.</p>
<div id="listaVoz"></div>
<button onclick="fecharVoz()" style="width:100%;margin-top:12px;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-weight:900">FECHAR E SALVAR</button>
</div></div>

<div id="alertaRota">⚠️ VOCÊ SAIU DA ROTA!</div>
<div id="topbar"><button id="btnStart" class="btn">🟢 COMECAR IDA</button><button id="btnStop" class="btn">🔴 PARAR</button><button id="btnBack" class="btn">🔵 VOLTAR</button><button id="btnVoz" class="btn" onclick="abrirVoz()">🎙️</button></div>
<div id="map"></div><div id="status"></div><div id="info">Pronto - 10m + sua voz + avatar pulando</div>

<script>
const SENHA="oliver123";
function check(){let v=document.getElementById("pass").value;if(v===SENHA){document.getElementById("lock").style.display="none";localStorage.setItem("vf_ok","1");}else{document.getElementById("err").style.display="block";}}
if(localStorage.getItem("vf_ok")==="1") document.getElementById("lock").style.display="none";
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter") check()});

// ==== GRAVADOR DE VOZ ====
let gravacoes = JSON.parse(localStorage.getItem("vf_voz")||"[null,null,null]");
if(gravacoes.length!=3) gravacoes=[null,null,null];
let mediaRec=null, chunks=[];
function abrirVoz(){document.getElementById("vozModal").style.display="flex";renderVoz();}
function fecharVoz(){document.getElementById("vozModal").style.display="none";}
function renderVoz(){
 let html="";
 for(let i=0;i<3;i++){
  let tem = gravacoes[i];
  html+=`<div class="falaItem"><b>F${i+1}</b> ${tem?`<button class="btnPlay" onclick="playVoz(${i})">▶️</button><button class="btnDel" onclick="delVoz(${i})">🗑️</button>`:`<span style="color:#94a3b8">vazia</span>`} <button class="btnRec" onclick="gravarVoz(${i})">🎙️ Gravar</button></div>`;
 }
 document.getElementById("listaVoz").innerHTML=html;
}
async function gravarVoz(idx){
 try{
  let stream = await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRec = new MediaRecorder(stream); chunks=[];
  mediaRec.ondataavailable=e=>chunks.push(e.data);
  mediaRec.onstop=()=>{
    let blob = new Blob(chunks,{type:"audio/webm"});
    let reader = new FileReader();
    reader.onloadend=()=>{gravacoes[idx]=reader.result;localStorage.setItem("vf_voz",JSON.stringify(gravacoes));renderVoz();};
    reader.readAsDataURL(blob);
    stream.getTracks().forEach(t=>t.stop());
  };
  mediaRec.start();
  alert("🎙️ GRAVANDO FALA "+(idx+1)+" - FALE AGORA: 'Você saiu da rota!' (3 seg)");
  setTimeout(()=>{if(mediaRec && mediaRec.state=="recording") mediaRec.stop();},3000);
 }catch(e){alert("Libera o microfone: "+e.message);}
}
function playVoz(i){if(gravacoes[i]){let a=new Audio(gravacoes[i]);a.play();}}
function delVoz(i){gravacoes[i]=null;localStorage.setItem("vf_voz",JSON.stringify(gravacoes));renderVoz();}
function tocarVozCustom(){
 let validas = gravacoes.map((v,i)=>v?i:null).filter(v=>v!==null);
 if(validas.length>0){
  let pick = validas[Math.floor(Math.random()*validas.length)];
  playVoz(pick);
  return true;
 }
 return false;
}

// ==== MAPA E ROTA ====
const ZAPNUM="5527998265267";
let map=L.map("map",{zoomControl:false}).setView([-20.3201,-40.3385],17);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
let route=[],idaRoute=[],poly=null,polyBorder=null,marker=null,watch=null,lastJump=null,total=0,cnt=0,modo="parado",foraDaRota=false;
const LIMITE_FORA_ROTA=10;
function speak(t){if(tocarVozCustom()) return; try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.rate=1.1;speechSynthesis.speak(u);}catch(e){}}
function show(t){let e=document.getElementById("status");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",4000);}
function sendZap(tipo,lat,lng){let msg=tipo==="ida"?`🟢 *Oliver INICIOU A IDA*%0Ahttps://www.google.com/maps?q=${lat},${lng}`:`🔵 *Oliver COMECOU A VOLTA*%0Ahttps://www.google.com/maps?q=${lat},${lng}`;window.open(`https://wa.me/${ZAPNUM}?text=${msg}`,"_blank");}
function walkAnim(){let wrap=document.querySelector(".avatar-wrap");if(!wrap) return;let dust=wrap.querySelector(".dust");wrap.classList.remove("walk");void wrap.offsetWidth;wrap.classList.add("walk");if(dust){dust.classList.remove("show");void dust.offsetWidth;dust.classList.add("show");}}
function distanciaDaRota(lat,lng){if(idaRoute.length<2) return 0;let menor=Infinity;for(let i=0;i<idaRoute.length;i++){let d=map.distance([lat,lng],idaRoute[i]);if(d<menor) menor=d;}return menor;}
function addPt(lat,lng){
 if(route.length>0){let dist=map.distance(route[route.length-1],[lat,lng]);if(dist>30) return;total+=dist;if(lastJump==null) lastJump=[lat,lng];if(map.distance(lastJump,[lat,lng])>=1){walkAnim();lastJump=[lat,lng];cnt++;}}
 route.push([lat,lng]);
 if(modo==="volta"){
   let dFora=distanciaDaRota(lat,lng);let alertaEl=document.getElementById("alertaRota");
   if(dFora>LIMITE_FORA_ROTA){if(!foraDaRota){foraDaRota=true;alertaEl.style.display="block";speak("Você saiu da rota");if(navigator.vibrate) navigator.vibrate([500,200,500]);}}
   else{if(foraDaRota){foraDaRota=false;alertaEl.style.display="none";speak("Voltou para a rota");}}
 }
 if(!poly){polyBorder=L.polyline(route,{color:"#ffffff",weight:10,opacity:.95,lineCap:"round",lineJoin:"round",smoothFactor:1}).addTo(map);poly=L.polyline(route,{color:"#16a34a",weight:6,opacity:1,lineCap:"round",lineJoin:"round",smoothFactor:1}).addTo(map);}else{poly.setLatLngs(route);polyBorder.setLatLngs(route);}
 if(!marker){let ic=L.divIcon({className:"",html:`<div class="avatar-wrap"><img src="avatar.png?v=final10m" style="width:80px;height:95px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))"><div class="dust"></div></div>`,iconSize:[80,95],iconAnchor:[40,75]});marker=L.marker([lat,lng],{icon:ic}).addTo(map);}else marker.setLatLng([lat,lng]);
 map.panTo([lat,lng]);
 document.getElementById("info").innerHTML=`<b>${total.toFixed(0)}m</b> | ${cnt} pulos | ${modo} ${foraDaRota?"- FORA 10m!":""} | voz ${gravacoes.filter(Boolean).length}/3`;
}
function startGPS(){watch=navigator.geolocation.watchPosition(p=>addPt(p.coords.latitude,p.coords.longitude),e=>show(e.message),{enableHighAccuracy:true,maximumAge:0,timeout:10000});}
document.getElementById("btnStart").onclick=()=>{
 route=[];idaRoute=[];total=0;cnt=0;lastJump=null;modo="ida";if(poly){map.removeLayer(poly);poly=null}if(polyBorder){map.removeLayer(polyBorder);polyBorder=null}if(marker){map.removeLayer(marker);marker=null}
 document.getElementById("btnStart").style.display="none";document.getElementById("btnStop").style.display="block";
 speak("Iniciando gravação");show("🟢 IDA");navigator.geolocation.getCurrentPosition(pos=>{addPt(pos.coords.latitude,pos.coords.longitude);sendZap("ida",pos.coords.latitude,pos.coords.longitude);startGPS();},()=>startGPS(),{enableHighAccuracy:true});
};
document.getElementById("btnStop").onclick=()=>{if(watch) navigator.geolocation.clearWatch(watch);idaRoute=[...route];modo="parado";document.getElementById("btnStop").style.display="none";document.getElementById("btnBack").style.display="block";document.getElementById("btnStart").style.display="block";speak("Parado");show("🔴 IDA salva");};
document.getElementById("btnBack").onclick=()=>{
 document.getElementById("btnBack").style.display="none";document.getElementById("btnStart").style.display="none";modo="volta";foraDaRota=false;
 let b=document.createElement("button");b.className="btn";b.style.background="#111";b.style.color="#fff";b.textContent="🏁 CHEGUEI";b.onclick=()=>location.reload();document.getElementById("topbar").appendChild(b);
 if(gravacoes.filter(Boolean).length==0){speak("Voltando, se sair dez metros eu aviso");}else{tocarVozCustom();}
 show("🔵 VOLTA - alerta 10m com sua voz ativo");
 navigator.geolocation.getCurrentPosition(pos=>{sendZap("volta",pos.coords.latitude,pos.coords.longitude);startGPS();},()=>startGPS(),{enableHighAccuracy:true});
};
</script>
</body>
</html>
