<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volta Fácil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f1115;color:#fff;overflow:hidden}
#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f1115;z-index:99;padding:20px}
#login h1{font-size:32px;margin-bottom:10px;color:#22c55e}
#login input{padding:16px;width:100%;max-width:320px;border-radius:12px;border:2px solid #22c55e;background:#1a1d24;color:#fff;font-size:18px;margin:15px 0;text-align:center}
#login button{padding:16px 40px;background:#22c55e;color:#000;border:none;border-radius:12px;font-weight:800;font-size:18px}
#app{display:none;flex-direction:column;height:100vh}
.header{padding:14px;background:#151821;display:flex;justify-content:space-between;align-items:center}
.header b{color:#22c55e}
#mapWrap{flex:1;position:relative;background:#e5e7eb;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#avatar{position:absolute;width:56px;height:56px;transform:translate(-50%,-90%);transition:transform 0.1s;z-index:5;font-size:44px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.jump{animation:jump 0.35s ease}
@keyframes jump{0%{transform:translate(-50%,-90%) scale(1)}50%{transform:translate(-50%,-140%) scale(1.2)}100%{transform:translate(-50%,-90%) scale(1)}}
.dust{position:absolute;width:20px;height:8px;background:radial-gradient(#a3a3a3,transparent);border-radius:50%;animation:dust 0.4s forwards}
@keyframes dust{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.5) translateY(10px);opacity:0}}
.controls{padding:12px;background:#151821;display:flex;gap:10px}
.controls button{flex:1;padding:14px;border-radius:12px;border:none;font-weight:800}
#startBtn{background:#22c55e;color:#000}
#zapBtn{background:#25D366;color:#000}
.info{padding:10px 14px;background:#1e222d;font-size:14px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="login">
<h1>Volta Fácil</h1>
<p style="opacity:.7">Digite sua senha</p>
<input id="pass" type="password" placeholder="senha">
<button onclick="entrar()">ENTRAR</button>
<p id="erro" style="color:#ef4444;margin-top:10px;display:none">Senha errada! Use oliver123</p>
</div>

<div id="app">
<div class="header"><b>🔵 Volta Fácil • LIVE</b><span id="distTxt">0m</span></div>
<div id="mapWrap">
<canvas id="c"></canvas>
<div id="avatar">🏃‍♂️</div>
</div>
<div class="info"><span>📍 Serra-ES → Centro</span><span id="speed">0 km/h</span></div>
<div class="controls">
<button id="startBtn" onclick="iniciar()">▶️ INICIAR VOLTA</button>
<button id="zapBtn" onclick="zap()">💬 WHATSAPP</button>
</div>
</div>
