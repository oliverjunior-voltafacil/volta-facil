<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Volta Facil - IDA AZUL VOLTA VERDE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{height:100vh;overflow:hidden;font-family:sans-serif;background:#fff}#map{height:100vh;width:100vw}
#topbar{position:absolute;top:0;left:0;right:0;z-index:1000;background:#fff;padding:8px;display:flex;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.btn{flex:1;padding:16px;border:none;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer}
#btnStart{background:#2563eb;color:#fff} /* AZUL IDA */
#btnStop{background:#ef4444;color:#fff;display:none}
#btnBack{background:#16a34a;color:#fff;display:none} /* VERDE VOLTA */
#btnVoz{background:#8b5cf6;color:#fff;flex:0 0 50px}
#status{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);z-index:1000;background:#000;color:#fff;padding:12px 20px;border-radius:20px;display:none;font-weight:700;text-align:center;max-width:90%}
#info{position:absolute;bottom:10px;left:10px;right:10px;z-index:1000;background:#fff;padding:12px;border-radius:14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:14px;font-weight:700}
#alertaRota{position:absolute;top:70px;left:10px;right:10px;z-index:2000;background:#ef4444;color:#fff;padding:18px;border-radius:18px;text-align:center;font-weight:900;font-size:18px;display:none}
#vozModal{position:absolute;inset:0;z-index:3000;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px}#vozBox{background:#fff;width:100%;max-width:400px;border-radius:20px;padding:20px}
</style></head><body>
<div id="topbar"><button id="btnStart" class="btn">🔵 IDA AZUL</button><button id="btnStop" class="btn">🔴 PARAR</button><button id="btnBack" class="btn">🟢 VOLTA VERDE</button><button id="btnVoz" class="btn" onclick="abrirVoz()">🎙️</button></div>
<div id="map"></div><div id="status"></div><div id="info">Volta Fácil - Azul IDA / Verde VOLTA</div>
<div id="alertaRota">⚠️ VOCÊ SAIU DA ROTA!</div>
<div id="vozModal"><div id="vozBox"><h2>🎙️ Sua voz</h2><div id="listaVoz"></div><button onclick="fecharVoz()" style="width:100%;margin-top:12px;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-weight:900">FECHAR</button></div></div>
<script>
let map=L.map("map",{zoomControl:false}).setView([-20.3201,-40.3385],17);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
let route=[],idaRoute=[],poly=null,polyBorder=null,polyIdaFundo=null,marker=null,watch=null,total=0,modo="parado",foraDaRota=false;
const LIMITE=12; // 10-15m que você pediu

function getCor(){ return modo==="ida" ? "#2563eb" : "#16a34a"; } // AZUL / VERDE
function getCorBorda(){ return modo==="ida" ? "#93c5fd" : "#86efac"; }

function addPt(lat,lng){
 if(route.length>0){let d=map.distance(route[route.length-1],[lat,lng]); if(d>30) return; total+=d;}
 route.push([lat,lng]);
 if(!poly){
   polyBorder=L.polyline(route,{color:"#fff",weight:12,opacity:.9,lineCap:"round"}).addTo(map);
   poly=L.polyline(route,{color:getCor(),weight:7,lineCap:"round"}).addTo(map);
 }else{
   poly.setLatLngs(route); polyBorder.setLatLngs(route);
   poly.setStyle({color:getCor()});
 }
 if(!marker){marker=L.marker([lat,lng]).addTo(map);} else marker.setLatLng([lat,lng]);
 map.panTo([lat,lng]);
 document.getElementById("info").innerHTML = (modo==="ida" ? "🔵 IDA AZUL - " : "🟢 VOLTA VERDE - ") + total.toFixed(0)+"m";
 // Alerta 12m
 if(modo==="volta" && idaRoute.length>1){
   let menor=Infinity; for(let p of idaRoute){ let d=map.distance([lat,lng],p); if(d<menor) menor=d; }
   let alerta=document.getElementById("alertaRota");
   if(menor>LIMITE && !foraDaRota){ foraDaRota=true; alerta.style.display="block"; if(navigator.vibrate) navigator.vibrate([500,200,500]); let u=new SpeechSynthesisUtterance("Você saiu da rota"); u.lang="pt-BR"; speechSynthesis.speak(u); }
   if(menor<=LIMITE && foraDaRota){ foraDaRota=false; alerta.style.display="none"; }
 }
}

document.getElementById("btnStart").onclick=()=>{
 route=[]; idaRoute=[]; total=0; modo="ida";
 if(poly){map.removeLayer(poly); map.removeLayer(polyBorder);} if(polyIdaFundo){map.removeLayer(polyIdaFundo);}
 document.getElementById("btnStart").style.display="none"; document.getElementById("btnStop").style.display="block";
 navigator.geolocation.watchPosition(p=>addPt(p.coords.latitude,p.coords.longitude),null,{enableHighAccuracy:true,maximumAge:0});
 watch=true;
};
document.getElementById("btnStop").onclick=()=>{ idaRoute=[...route]; modo="parado"; document.getElementById("btnStop").style.display="none"; document.getElementById("btnBack").style.display="block"; document.getElementById("btnStart").style.display="block"; };
document.getElementById("btnBack").onclick=()=>{
 // mostra ida antiga em azul tracejado de fundo
 if(idaRoute.length>0){ polyIdaFundo=L.polyline(idaRoute,{color:"#2563eb",weight:4,opacity:.4,dashArray:"8 10"}).addTo(map); }
 route=[]; total=0; modo="volta"; foraDaRota=false;
 document.getElementById("btnBack").style.display="none"; document.getElementById("btnStart").style.display="none";
 let b=document.createElement("button"); b.className="btn"; b.style.background="#111"; b.style.color="#fff"; b.textContent="🏁 CHEGUEI"; b.onclick=()=>location.reload(); document.getElementById("topbar").appendChild(b);
};
function abrirVoz(){document.getElementById("vozModal").style.display="flex";} function fecharVoz(){document.getElementById("vozModal").style.display="none";}
</script></body></html>
